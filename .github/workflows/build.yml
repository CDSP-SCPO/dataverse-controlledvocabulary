name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: "*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generate metadatablocks and translations
        run: |
          DV_VERSION=$(cat DATAVERSE-VERSION | tr -d '\n')
          ./translations/create-languagepack.sh "${DV_VERSION}"
          cp metadatablocks/*.tsv .

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-artifacts
          path: |
            *.tsv
            language_*.zip
          retention-days: 3
